name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          echo "y" | sdkmanager "ndk;21.4.7075529"

      - name: Install gettext
        run: sudo apt-get install -y gettext

      # PATCH: удаляем проверку версии SDL2 из irr/src/CMakeLists.txt
      - name: Patch Irrlicht SDL2 version check
        run: |
          cd $GITHUB_WORKSPACE
          sed -i '/CHECK_SDL_VERSION/d' irr/src/CMakeLists.txt
          sed -i '/SDL2 is too old/d' irr/src/CMakeLists.txt
          sed -i '/message(FATAL_ERROR/d' irr/src/CMakeLists.txt

      - name: Build SDL2 for Android
        run: |
          export ANDROID_NDK=$ANDROID_NDK_HOME
          cd $GITHUB_WORKSPACE
          git clone --depth 1 --branch release-2.30.10 https://github.com/libsdl-org/SDL.git sdl2-src
          mkdir -p sdl2-build && cd sdl2-build
          cmake ../sdl2-src \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_STATIC=ON \
            -DSDL_SHARED=OFF \
            -DSDL_TEST=OFF \
            -DSDL_EXAMPLES=OFF \
            -DSDL_SENSOR=OFF
          make -j2
          mkdir -p $GITHUB_WORKSPACE/android/native/deps/arm64-v8a/SDL2
          cp libSDL2.a $GITHUB_WORKSPACE/android/native/deps/arm64-v8a/SDL2/
          cp -r ../sdl2-src/include $GITHUB_WORKSPACE/android/native/deps/arm64-v8a/SDL2/

      - name: Build native libs
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p build-android && cd build-android
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-29 \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_CLIENT=TRUE \
                -DBUILD_SERVER=FALSE \
                -DENABLE_SYSTEM_JSONCPP=FALSE \
                -DENABLE_SYSTEM_GMP=FALSE \
                -DSDL2_LIBRARY=$GITHUB_WORKSPACE/android/native/deps/arm64-v8a/SDL2/libSDL2.a \
                -DSDL2_INCLUDE_DIR=$GITHUB_WORKSPACE/android/native/deps/arm64-v8a/SDL2/include \
                ..
          make -j2
          mkdir -p ../android/native/deps/lib/arm64-v8a
          cp lib/libluanti.so ../android/native/deps/lib/arm64-v8a/

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CloakV4-Android
          path: android/app/build/outputs/apk/debug/*.apk
